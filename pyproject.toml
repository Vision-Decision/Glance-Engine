[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "glance-engine"
version = "0.2.0"
description = "Serving engine for decision models: one prefill per image answers many typed questions, and one question scans many cached images or clips."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"  # transformers 5.23 requires Python 3.11+
authors = [{ name = "Vision-Decision" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Environment :: GPU :: NVIDIA CUDA",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Versions match the benchmark stack (constraints/g4-benchmarks.txt). The CPU suite is tested
# against constraints/cpu-tested.txt.
dependencies = [
    "glance-core @ git+https://github.com/Vision-Decision/glance-core@v0.2.0",
    "torch>=2.6",
    "transformers==5.23.0",
    "peft>=0.17",
    "numpy",
    "pillow",
    "safetensors",
    "huggingface_hub",
]

[project.optional-dependencies]
# Fused Gated-DeltaNet kernels (flash-linear-attention 0.6.0) through glance-core.
gpu = ["glance-core[gpu] @ git+https://github.com/Vision-Decision/glance-core@v0.2.0"]
# HTTP server (glance-serve, speed.server).
serve = ["aiohttp>=3.9"]
# Glance-X models (glance_engine.x): the glancex model package.
x = ["glancex @ git+https://github.com/Vision-Decision/Glance-X-Lite@v0.3.0"]
# Optional SM120 (RTX PRO 6000 / Blackwell workstation) packed GDN prefill. Exact versions:
# speed/flash_gdn.py refuses any other pair and falls back to FLA.
sm120-prefill = ["flash-qla==0.1.3", "tilelang==0.1.15"]
# Report tables and figures from raw benchmark JSON.
bench = ["matplotlib", "scipy"]
test = ["pytest>=8", "aiohttp>=3.9", "glance-engine[x]"]
dev = ["glance-engine[test]", "ruff>=0.6"]

[project.scripts]
glance-serve = "glance_engine.serve:main"
glance-kernels = "glance_engine.kernels:main"

[project.urls]
Repository = "https://github.com/Vision-Decision/glance-engine"
Model = "https://huggingface.co/Vision-Decision/Glance-4B-preview"

[tool.setuptools.packages.find]
include = ["glance_engine", "glance_engine.*", "speed", "speed.*", "scan", "scan.*"]
exclude = ["scan.vm", "scan.vm.*"]
namespaces = true

[tool.setuptools.package-data]
speed = ["specpilot/*.cu", "specpilot/LICENSE"]
scan = ["flash_vision/*.cpp", "flash_vision/*.h", "flash_vision/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests", "speed", "scan"]
python_files = ["test_*.py"]
addopts = "-ra"
markers = [
    "slow: tiny-model end-to-end runs (tens of seconds on CPU)",
    "gpu: needs CUDA and real weights (skipped in CI)",
]
filterwarnings = [
    "ignore:CUDA is not available or torch_xla is imported:UserWarning",
    "ignore:User provided device_type of 'cuda':UserWarning",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
