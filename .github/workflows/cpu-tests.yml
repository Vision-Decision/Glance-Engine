name: cpu-tests

# CPU only: the tiny-config exactness suite, the public API, the HTTP app and the
# model-free unit tests. GPU equivalence gates are run by hand (docs/exactness.md).
on:
  push:
    branches: [main, release, engine-opt]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e '.[dev]'

      - name: Lint
        run: ruff check glance_engine tests examples conftest.py

      # The tiny model downloads only the Qwen3.5-4B config and processor files.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-qwen3.5-4b-config-v1

      - name: Test
        env:
          CUDA_VISIBLE_DEVICES: ""
          TOKENIZERS_PARALLELISM: "false"
        run: pytest -q
