<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Glance engine architecture</title>
<desc id="d">A scheduler batches requests into one device step. Each image runs the vision tower and a shared prefix prefill once; question blocks branch from the shared state and heads read out answers without decoding. Retained prefixes form a bank that one new question scans in one pass.</desc>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9198a1"/></marker></defs>
<rect x="20" y="16" width="960" height="62" rx="10" fill="#3d1f0b" stroke="#f0883e" stroke-width="1.5"/>
<text x="40" y="43" fill="#f0883e" font-size="13" font-weight="700" text-anchor="start">SCHEDULER</text>
<text x="40" y="63" fill="#9198a1" font-size="13" font-weight="400" text-anchor="start">one device owner</text>
<text x="190" y="43" fill="#f0f6fc" font-size="14" font-weight="400" text-anchor="start">Requests from many clients are admitted in order, gathered for up to 0.5 ms and packed</text>
<text x="190" y="63" fill="#f0f6fc" font-size="14" font-weight="400" text-anchor="start">under a token budget into one device step. Python calls and HTTP requests share this path.</text>
<line x1="500" y1="78" x2="500" y2="112" stroke="#9198a1" stroke-width="1.6" marker-end="url(#head)"/>
<rect x="20" y="112" width="960" height="290" rx="12" fill="#151b23" stroke="#3d444d" stroke-width="1"/>
<rect x="40" y="190" width="100" height="100" rx="8" fill="#151b23" stroke="#9198a1" stroke-width="1.5"/>
<polygon points="52,276 82,232 104,262 116,248 130,276" fill="#3d444d"/>
<circle cx="114" cy="214" r="9" fill="#3d444d"/>
<text x="90" y="312" fill="#9198a1" font-size="13" font-weight="400" text-anchor="middle">image</text>
<line x1="140" y1="240" x2="168" y2="240" stroke="#9198a1" stroke-width="1.6" marker-end="url(#head)"/>
<rect x="170" y="195" width="112" height="90" rx="10" fill="#0c2d6b" stroke="#4493f8" stroke-width="1.5"/>
<text x="226" y="234" fill="#f0f6fc" font-size="14" font-weight="600" text-anchor="middle">vision</text>
<text x="226" y="252" fill="#f0f6fc" font-size="14" font-weight="600" text-anchor="middle">tower</text>
<text x="226" y="306" fill="#9198a1" font-size="13" font-weight="400" text-anchor="middle">once per image</text>
<line x1="282" y1="240" x2="310" y2="240" stroke="#9198a1" stroke-width="1.6" marker-end="url(#head)"/>
<rect x="312" y="150" width="196" height="180" rx="12" fill="#0c2d6b" stroke="#4493f8" stroke-width="2"/>
<text x="410" y="182" fill="#4493f8" font-size="15" font-weight="700" text-anchor="middle">shared prefix</text>
<text x="410" y="210" fill="#f0f6fc" font-size="14" font-weight="400" text-anchor="middle">prefilled once</text>
<text x="410" y="236" fill="#f0f6fc" font-size="14" font-weight="400" text-anchor="middle">Gated DeltaNet state</text>
<text x="410" y="256" fill="#f0f6fc" font-size="14" font-weight="400" text-anchor="middle">+ attention K/V</text>
<text x="410" y="290" fill="#9198a1" font-size="13" font-weight="400" text-anchor="middle">kept in the prefix</text>
<text x="410" y="306" fill="#9198a1" font-size="13" font-weight="400" text-anchor="middle">cache for follow-ups</text>
<text x="660" y="140" fill="#9198a1" font-size="13" font-weight="400" text-anchor="middle">question blocks branch from the shared state</text>
<text x="875" y="140" fill="#9198a1" font-size="13" font-weight="400" text-anchor="middle">heads read out answers</text>
<path d="M508,240 C538.0,240 538.0,172 568,172" fill="none" stroke="#ab7df8" stroke-width="1.6" marker-end="url(#head)"/>
<rect x="570" y="150" width="180" height="44" rx="8" fill="#2e1a4f" stroke="#ab7df8" stroke-width="1.5"/>
<text x="582" y="169" fill="#ab7df8" font-size="13" font-weight="700" text-anchor="start">Q1 box</text>
<text x="582" y="186" fill="#f0f6fc" font-size="13" font-weight="400" text-anchor="start">“the red car”</text>
<line x1="750" y1="172" x2="776" y2="172" stroke="#9198a1" stroke-width="1.6" marker-end="url(#head)"/>
<rect x="778" y="150" width="194" height="44" rx="8" fill="#0f3d1f" stroke="#3fb950" stroke-width="1.5"/>
<text x="875" y="177" fill="#f0f6fc" font-size="13" font-weight="400" text-anchor="middle">P(present) · box · P(IoU≥0.5)</text>
<path d="M508,240 C538.0,240 538.0,230 568,230" fill="none" stroke="#ab7df8" stroke-width="1.6" marker-end="url(#head)"/>
<rect x="570" y="208" width="180" height="44" rx="8" fill="#2e1a4f" stroke="#ab7df8" stroke-width="1.5"/>
<text x="582" y="227" fill="#ab7df8" font-size="13" font-weight="700" text-anchor="start">Q2 yes/no</text>
<text x="582" y="244" fill="#f0f6fc" font-size="13" font-weight="400" text-anchor="start">“is it raining?”</text>
<line x1="750" y1="230" x2="776" y2="230" stroke="#9198a1" stroke-width="1.6" marker-end="url(#head)"/>
<rect x="778" y="208" width="194" height="44" rx="8" fill="#0f3d1f" stroke="#3fb950" stroke-width="1.5"/>
<text x="875" y="235" fill="#f0f6fc" font-size="13" font-weight="400" text-anchor="middle">P(yes)</text>
<path d="M508,240 C538.0,240 538.0,288 568,288" fill="none" stroke="#ab7df8" stroke-width="1.6" marker-end="url(#head)"/>
<rect x="570" y="266" width="180" height="44" rx="8" fill="#2e1a4f" stroke="#ab7df8" stroke-width="1.5"/>
<text x="582" y="285" fill="#ab7df8" font-size="13" font-weight="700" text-anchor="start">Q3 choice</text>
<text x="582" y="302" fill="#f0f6fc" font-size="13" font-weight="400" text-anchor="start">day / night</text>
<line x1="750" y1="288" x2="776" y2="288" stroke="#9198a1" stroke-width="1.6" marker-end="url(#head)"/>
<rect x="778" y="266" width="194" height="44" rx="8" fill="#0f3d1f" stroke="#3fb950" stroke-width="1.5"/>
<text x="875" y="293" fill="#f0f6fc" font-size="13" font-weight="400" text-anchor="middle">P(day), P(night)</text>
<path d="M508,240 C538.0,240 538.0,346 568,346" fill="none" stroke="#ab7df8" stroke-width="1.6" marker-end="url(#head)"/>
<rect x="570" y="324" width="180" height="44" rx="8" fill="#2e1a4f" stroke="#ab7df8" stroke-width="1.5"/>
<text x="582" y="343" fill="#ab7df8" font-size="13" font-weight="700" text-anchor="start">Qn …</text>
<text x="582" y="360" fill="#f0f6fc" font-size="13" font-weight="400" text-anchor="start">any typed question</text>
<line x1="750" y1="346" x2="776" y2="346" stroke="#9198a1" stroke-width="1.6" marker-end="url(#head)"/>
<rect x="778" y="324" width="194" height="44" rx="8" fill="#0f3d1f" stroke="#3fb950" stroke-width="1.5"/>
<text x="875" y="351" fill="#f0f6fc" font-size="13" font-weight="400" text-anchor="middle">one distribution each</text>
<text x="767" y="392" fill="#3fb950" font-size="13" font-weight="600" text-anchor="middle">one forward, every answer at once · no decode loop</text>
<line x1="410" y1="330" x2="410" y2="428" stroke="#d29922" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#head)"/>
<text x="420" y="386" fill="#d29922" font-size="13" font-weight="400" text-anchor="start" font-style="italic">retain</text>
<rect x="312" y="430" width="196" height="92" rx="12" fill="#3b2e0a" stroke="#d29922" stroke-width="2"/>
<text x="410" y="458" fill="#d29922" font-size="15" font-weight="700" text-anchor="middle">bank of N prefixes</text>
<text x="410" y="482" fill="#f0f6fc" font-size="13" font-weight="400" text-anchor="middle">GPU-resident or</text>
<text x="410" y="500" fill="#f0f6fc" font-size="13" font-weight="400" text-anchor="middle">pinned host memory</text>
<line x1="508" y1="476" x2="568" y2="476" stroke="#9198a1" stroke-width="1.6" marker-end="url(#head)"/>
<rect x="570" y="430" width="394" height="92" rx="12" fill="#3b2e0a" stroke="#d29922" stroke-width="1.5"/>
<text x="588" y="458" fill="#d29922" font-size="13" font-weight="700" text-anchor="start">CACHED SCAN</text>
<text x="588" y="482" fill="#f0f6fc" font-size="14" font-weight="400" text-anchor="start">one new question × N images or clips → N answers</text>
<text x="588" y="502" fill="#f0f6fc" font-size="14" font-weight="400" text-anchor="start">in one packed forward; no vision tower, no prefill</text>
<text x="40" y="458" fill="#9198a1" font-size="13" font-weight="400" text-anchor="start">Same engine,</text>
<text x="40" y="478" fill="#9198a1" font-size="13" font-weight="400" text-anchor="start">the other direction:</text>
<text x="40" y="498" fill="#9198a1" font-size="13" font-weight="400" text-anchor="start">one question, many images</text>
</svg>
